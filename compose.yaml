name: tollgate
x-app: &app
  build: .
  image: tollgate:1.2.0
  env_file: gateway/.env
  environment: &environment
    TOLLGATE_ENVIRONMENT: production
    TOLLGATE_MODE: live
    TOLLGATE_DATABASE_URL: postgresql://tollgate_app:${TOLLGATE_DB_PASSWORD:?Set TOLLGATE_DB_PASSWORD in the root .env}@database:5432/tollgate
    TOLLGATE_PUBLIC_ORIGIN: https://${TOLLGATE_DOMAIN:?Set TOLLGATE_DOMAIN in the root .env}
    TOLLGATE_WORKER_ENABLED: "false"
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: tollgate
      POSTGRES_DB: tollgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      TOLLGATE_DB_PASSWORD: ${TOLLGATE_DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data, ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-tollgate.sh:ro]
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tollgate -d tollgate"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    environment:
      <<: *environment
      TOLLGATE_DATABASE_URL: postgresql://tollgate:${POSTGRES_PASSWORD}@database:5432/tollgate
    command: [python, manage.py, migrate]
    restart: "no"
    depends_on:
      database: {condition: service_healthy}
  gateway:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
  worker:
    <<: *app
    command: [python, manage.py, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  edge:
    image: caddy:2
    environment:
      TOLLGATE_DOMAIN: ${TOLLGATE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks: [private]
    restart: unless-stopped
    depends_on: [gateway]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  private:
