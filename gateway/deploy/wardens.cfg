# Requests are not replayed after an ambiguous failure.
global
    maxconn 2000

defaults
    mode http
    timeout connect 3s
    timeout client 240s
    timeout server 240s
    timeout http-request 10s
    timeout queue 5s
    retries 0

frontend ai_api
    bind :8080
    acl api_path path_beg /v1/
    http-request deny deny_status 404 unless api_path
    default_backend wardens

backend wardens
    balance leastconn
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host 127.0.0.1
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server warden1 warden-1:8000 check
    server warden2 warden-2:8000 check
    # Add a third service with a unique node ID, then enable its server here.
    # server warden3 warden-3:8000 check
