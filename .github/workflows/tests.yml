name: Tollgate checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tollgate_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tollgate" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r gateway/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: gateway
        env:
          TOLLGATE_TEST_POSTGRES_URL: postgresql://tollgate:test_password@localhost:5432/tollgate_test
      - run: node --check gateway/app/ui/dashboard.js
